# Translates the titles in auto-queue.json in the LAST HOUR before the Gemini quota resets (midnight Pacific time =
# 13:30 in Sri Lanka in winter, 12:30 in summer), using the quota that would be lost anyway. It stops at the reset so
# visitors get the fresh quota. Results show up under "Ready Sinhala subtitles" on the home page.
# Needs the repository secret ADMIN_KEY (same value as ADMIN_KEY in Vercel). Optional secret SITE_URL.
# Run it by hand any time: Actions -> Auto translate -> Run workflow.
name: Auto translate

on:
  schedule:
    - cron: "10 6 * * *"   # 23:10 Pacific in summer time (the script exits when it is not Pacific hour 23)
    - cron: "10 7 * * *"   # 23:10 Pacific in winter time = 12:40 in Sri Lanka
    # GitHub can start scheduled runs 10-60 minutes late (or skip one), so there are backup runs 30 minutes later.
    # They only do something when the first run did not (finished episodes are skipped; the script stops at the reset).
    - cron: "40 6 * * *"
    - cron: "40 7 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "cron = started by the Vercel cron (keeps the last-hour check); manual = ignore it"
        default: manual

concurrency:
  group: auto-translate
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install headless Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Translate the queue
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          FROM_CRON: ${{ inputs.source == 'cron' && '1' || '' }}
        run: node scripts/auto-translate.js
