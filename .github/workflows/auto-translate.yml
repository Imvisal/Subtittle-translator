# Translates the titles in auto-queue.json right after the Gemini quota resets (midnight Pacific time =
# 13:30 in Sri Lanka in winter, 12:30 in summer), then they show up under "Ready Sinhala subtitles" on the home page.
# Needs the repository secret ADMIN_KEY (same value as ADMIN_KEY in Vercel). Optional secret SITE_URL.
# Run it by hand any time: Actions -> Auto translate -> Run workflow.
name: Auto translate

on:
  schedule:
    - cron: "5 7 * * *"    # 00:05 Pacific in summer time (the script exits when it is not the reset hour)
    - cron: "5 8 * * *"    # 00:05 Pacific in winter time
  workflow_dispatch:

concurrency:
  group: auto-translate
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install headless Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Translate the queue
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: node scripts/auto-translate.js
