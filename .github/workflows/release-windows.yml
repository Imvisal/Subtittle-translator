name: Release Windows App

# Push a tag like v1.1.5 (same tag as the Android release) and this builds the
# Windows installer + portable exe and adds them to the GitHub Release as
# SinSubz-Setup.exe and SinSubz-Portable.exe (the files version.json points to).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "v$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION."
            exit 1
          fi

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Build installer + portable exe
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist

      - name: List build output
        run: ls -la desktop/dist

      - name: Upload to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -p "require('./version.json').notes" > release-notes.txt
          gh release create "$GITHUB_REF_NAME" desktop/dist/SinSubz-Setup.exe desktop/dist/SinSubz-Portable.exe \
            --title "SinSubz $GITHUB_REF_NAME" \
            --notes-file release-notes.txt \
          || gh release upload "$GITHUB_REF_NAME" desktop/dist/SinSubz-Setup.exe desktop/dist/SinSubz-Portable.exe --clobber

      - name: Keep the exe files as a build artifact too
        uses: actions/upload-artifact@v4
        with:
          name: SinSubz-Windows
          path: |
            desktop/dist/SinSubz-Setup.exe
            desktop/dist/SinSubz-Portable.exe
