name: Release Android App

# Push a tag like v1.1.0 (see scripts/bump-version.js) and this builds the APK
# and publishes it to GitHub Releases as SinSubz.apk, which is the file
# version.json points the installed apps to.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tag must match package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "v$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION."
            echo "Run: node scripts/bump-version.js <version> \"notes\" and commit before tagging."
            exit 1
          fi

      - name: Install dependencies
        run: npm install

      - name: Build web files for the app
        run: npm run build:www

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Name the APK like version.json expects
        run: cp android/app/build/outputs/apk/release/app-release.apk SinSubz.apk

      - name: Release notes from version.json
        run: node -p "require('./version.json').notes" > release-notes.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" SinSubz.apk \
            --title "SinSubz $GITHUB_REF_NAME" \
            --notes-file release-notes.txt \
          || gh release upload "$GITHUB_REF_NAME" SinSubz.apk --clobber
