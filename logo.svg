<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fa2ff"/>
      <stop offset="0.55" stop-color="#8479ff"/>
      <stop offset="1" stop-color="#c78bff"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.2" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5fa2ff"/>
      <stop offset="1" stop-color="#a47bff"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#1a1760" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#shine)"/>

  <!-- back bubble: the translated line -->
  <path d="M282 78 h130 a46 46 0 0 1 46 46 v78 a46 46 0 0 1 -46 46 h-14 l22 52 -64 -52 h-74 a46 46 0 0 1 -46 -46 v-78 a46 46 0 0 1 46 -46 z"
