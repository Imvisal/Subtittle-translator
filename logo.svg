  <!-- AI sparkle -->
  <path d="M347 108 Q352 160 404 165 Q352 170 347 222 Q342 170 290 165 Q342 160 347 108 Z" fill="#fff"/>
  <path d="M420 118 Q422 138 440 140 Q422 142 420 162 Q418 142 400 140 Q418 138 420 118 Z" fill="#fff" fill-opacity="0.9"/>

  <!-- front bubble: the original subtitle -->
  <g filter="url(#sh)">
    <path d="M118 214 h206 a56 56 0 0 1 56 56 v76 a56 56 0 0 1 -56 56 h-120 l-92 66 24 -66 h-18 a56 56 0 0 1 -56 -56 v-76 a56 56 0 0 1 56 -56 z"
          transform="translate(-30 0)" fill="#fff"/>
  </g>

  <!-- subtitle lines -->
  <rect x="122" y="262" width="194" height="30" rx="15" fill="#1b1a5e"/>
  <rect x="122" y="320" width="124" height="30" rx="15" fill="url(#bar2)"/>
