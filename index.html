<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="SubLanka AI - Translate English subtitles to Sinhala"
    >

    <title>SubLanka AI</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <main class="container">

        <!-- Header -->
        <header class="header">

            <div class="logo">
                <span class="logo-icon">S</span>
                <span>SubLanka AI</span>
            </div>

            <h1>
                Translate Subtitles
            </h1>

            <p class="subtitle">
                Translate English subtitles into natural Sinhala
            </p>

        </header>


        <!-- Upload Section -->
        <section class="upload-section">
<!-- SEARCH MOVIE / TV -->
<div class="search-section">

    <h2>Find Subtitle</h2>

    <p>Search a movie or TV series</p>

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Enter movie or TV series name..."
        >

        <button
            type="button"
            id="searchBtn"
        >
            🔍 Search
        </button>

    </div>

</div>

<div id="searchStatus"></div>

<div id="searchResults"></div>

<div class="search-divider">
    <span>OR</span>
</div>
            <div class="upload-box">

                <div class="upload-icon">
                    ↑
                </div>

                <h2>
                    Upload Subtitle
                </h2>

                <p>
                    Select an English .srt subtitle file
                </p>

                <label
                    for="subtitleFile"
                    class="file-label"
                >
                    Choose SRT File
                </label>

                <input
                    type="file"
                    id="subtitleFile"
                    accept=".srt"
                >

                <div
                    id="fileName"
                    class="file-name"
                >
                    No file selected
                </div>

            </div>

        </section>


        <!-- Language -->
        <section class="settings">

            <label for="language">
                Translation Language
            </label>

            <select id="language">

                <option value="si">
                    🇱🇰 Sinhala
                </option>

                <option value="ta">
                    🇱🇰 Tamil
                </option>

            </select>

        </section>


        <!-- Translate Button -->
        <button
            id="translateBtn"
            class="translate-btn"
            type="button"
        >
            <span>Translate Subtitle</span>
        </button>


        <!-- Progress -->
        <section
            class="progress-container"
            id="progressContainer"
        >

            <div class="progress-info">

                <span id="progressText">
                    Ready
                </span>

                <span id="progressPercent">
                    0%
                </span>

            </div>

            <div class="progress-bar">

                <div
                    class="progress-fill"
                    id="progressFill"
                ></div>

            </div>

        </section>


        <!-- Subtitle Preview -->
        <section class="preview-section">

            <div class="section-header">

                <h2>
                    Subtitle Preview
                </h2>

                <span class="format-badge">
                    .SRT
                </span>

            </div>

            <textarea
                id="preview"
                placeholder="Your subtitle content will appear here..."
                spellcheck="false"
            ></textarea>

        </section>


        <!-- Download -->
        <button
            id="downloadBtn"
            class="download-btn"
            type="button"
        >
            ↓ &nbsp; Download Sinhala Subtitle
        </button>


        <!-- Footer -->
    <footer class="site-footer">

    <div class="footer-brand">
        <span>SubLanka AI</span>
        <span class="footer-dot">•</span>
        <span>English → Sinhala</span>
    </div>

    <div class="footer-social">

        <a
            href="https://github.com/Imvisal"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="GitHub"
        >
            <i class="fab fa-github"></i>
        </a>

        <a
            href="https://www.facebook.com/share/1EkW6FRkb9/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Facebook"
        >
            <i class="fab fa-facebook"></i>
        </a>

    </div>

    <div class="footer-copy">
        © 2026 SubLanka AI
    </div>

</footer>

    </main>


    <script src="script.js"></script>

</body>

</html>
