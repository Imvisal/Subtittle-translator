<body class="legal-page">
<main class="legal-container" style="max-width:1100px">
    <header class="legal-header">
        <a href="index.html" class="back-home">← Back to SinSubz</a>
        <div class="legal-logo"><img src="logo-128.png?v=1133" alt="SinSubz"></div>
        <h1>Ready Sinhala subtitles</h1>
        <p>Already translated. Pick one and download it, no waiting.</p>
    </header>

    <section class="ready-section rd-page" id="readyTitles" data-page="all" hidden aria-label="Ready Sinhala subtitles">
        <div class="rd-tools" id="rdTools" hidden>
            <form class="rd-find" role="search" id="rdFind">
                <input type="search" id="rdQ" placeholder="Search here" aria-label="Search ready subtitles" autocomplete="off" maxlength="60">
                <button type="submit" aria-label="Search">&#128269;</button>
            </form>
            <div class="rd-seg" id="rdSeg" role="group" aria-label="Type">
                <button type="button" data-t="" class="on">All</button>
                <button type="button" data-t="movie">Movies</button>
                <button type="button" data-t="tv">TV</button>
            </div>
            <select id="rdG" class="rd-sel" aria-label="Genre"><option value="">All genres</option></select>
        </div>
        <div class="rd-grid"></div>
        <div class="rd-more" id="rdMore" hidden><button type="button">Show more</button></div>
        <div class="rd-empty" id="rdEmpty" hidden>Nothing found. Try another word or filter.</div>
        <div class="rd-panel" hidden></div>
