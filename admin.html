<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#080d1b">
    <title>SinSubz Admin</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any">
    <style>
        :root { --bg:#0b0d1a; --card:#14172b; --line:#262a45; --text:#eceaff; --muted:#9a98b8; --acc:#8f86ff; --acc2:#5eead4; --bad:#ff8a8a; }
        @media (prefers-color-scheme: light) { :root { --bg:#f4f4fb; --card:#fff; --line:#dcdcee; --text:#1a1830; --muted:#6a6888; --acc2:#0d9488; } }
        * { box-sizing:border-box; }
        body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
        main { max-width:1100px; margin:0 auto; padding:22px 16px 70px; }
        h1 { font-size:22px; margin:0; }
        h2 { font-size:15px; margin:0 0 12px; color:var(--muted); font-weight:600; letter-spacing:.02em; }
        .top { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
        .sub { color:var(--muted); font-size:13px; margin:2px 0 0; }
        .row { display:flex; gap:8px; flex-wrap:wrap; }
        input { flex:1; min-width:170px; padding:11px 13px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:inherit; font:inherit; }
        button, .btn { padding:10px 16px; border:0; border-radius:10px; background:var(--acc); color:#fff; font:inherit; font-weight:700; cursor:pointer; text-decoration:none; display:inline-block; }
        button.ghost, .btn.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); font-weight:500; padding:8px 13px; }
        .err { color:var(--bad); margin-top:10px; min-height:1.3em; }
        .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-bottom:18px; }
        .stat { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; }
        .stat b { display:block; font-size:26px; line-height:1.15; font-variant-numeric:tabular-nums; }
        .stat span { color:var(--muted); font-size:12.5px; }
        .stat.hi b { color:var(--acc2); }
        .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:16px; }
        .two { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
        @media (max-width:760px) { .two { grid-template-columns:1fr; } }
        .chart { display:flex; align-items:flex-end; gap:4px; height:130px; }
        .chart .c { flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; height:100%; min-width:0; }
        .chart .bar { width:100%; background:var(--acc); border-radius:4px 4px 0 0; min-height:2px; }
        .chart.u .bar { background:var(--acc2); }
        .chart .v { font-size:10.5px; color:var(--muted); margin-bottom:2px; font-variant-numeric:tabular-nums; }
        .chart .d { font-size:10px; color:var(--muted); margin-top:4px; }
        table { width:100%; border-collapse:collapse; font-size:14px; }
        th { text-align:left; color:var(--muted); font-weight:600; font-size:12px; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
        td { padding:8px; border-bottom:1px solid var(--line); vertical-align:middle; }
        .who { display:flex; align-items:center; gap:9px; min-width:0; }
        .who img, .who .av { width:30px; height:30px; border-radius:50%; flex:none; background:var(--line); object-fit:cover; }
        .who .av { display:grid; place-items:center; font-size:13px; font-weight:700; color:var(--muted); }
        .who div { min-width:0; } .who small { display:block; color:var(--muted); overflow:hidden; text-overflow:ellipsis; }
        .tag { font-size:11.5px; padding:2px 8px; border-radius:99px; border:1px solid var(--line); color:var(--muted); }
        .tbl { overflow-x:auto; }
        .list { list-style:none; margin:0; padding:0; font-size:14px; }
        .list li { display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-bottom:1px solid var(--line); }
        .list li span:last-child { color:var(--muted); font-size:12.5px; white-space:nowrap; }
        .empty { color:var(--muted); font-size:14px; }
        [hidden] { display:none !important; }
    </style>
</head>
<body>
<main>
    <div class="top">
        <div>
            <h1>SinSubz Admin</h1>
            <p class="sub" id="sub">Private. Open it with your admin key.</p>
        </div>
        <div class="row" id="tools" hidden>
            <button class="ghost" id="refresh" type="button">Refresh</button>
            <a class="btn ghost" href="/inbox.html">Messages</a>
            <button class="ghost" id="logout" type="button">Lock</button>
        </div>
    </div>

    <form class="row" id="login">
        <input type="password" id="key" placeholder="Admin key" autocomplete="current-password">
        <button type="submit">Open</button>
    </form>
    <div class="err" id="err"></div>

    <div id="panel" hidden>
        <div class="grid" id="today"></div>
        <h2>All time</h2>
        <div class="grid" id="totals"></div>

        <div class="two">
            <div class="card"><h2>Translations per day (last 14 days)</h2><div class="chart" id="chartT"></div></div>
            <div class="card"><h2>Active signed-in users per day</h2><div class="chart u" id="chartU"></div></div>
        </div>

        <div class="two">
            <div class="card"><h2>Latest translated titles</h2><ul class="list" id="recent"></ul></div>
            <div class="card"><h2>Downloads</h2><ul class="list" id="downloads"></ul></div>
        </div>

        <div class="card">
            <div class="top" style="margin-bottom:8px">
                <h2 style="margin:0" id="usersTitle">Signed-in Google accounts</h2>
                <div class="row">
                    <input id="find" placeholder="Search name or email" style="min-width:200px;padding:8px 11px">
                    <button class="ghost" id="csv" type="button">Download CSV</button>
                </div>
            </div>
            <div class="tbl"><table>
                <thead><tr><th>Account</th><th>Using</th><th>First seen</th><th>Last seen</th><th>Translated</th></tr></thead>
                <tbody id="users"></tbody>
            </table></div>
            <p class="empty" id="usersNote"></p>
        </div>
    </div>
</main>
<script src="admin.js"></script>
</body>
</html>
